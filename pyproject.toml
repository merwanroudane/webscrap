[project]
name = "smart-research-web-scraper"
version = "0.2.1"
description = "Research-oriented Streamlit application that turns web pages into analysis-ready datasets."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup :: HTML",
]
keywords = ["web-scraping", "research", "data-collection", "streamlit", "reproducibility"]
dependencies = [
  # Kept in step with requirements.txt: only what the application imports.
  "streamlit",
  "pydantic>=2",
  "python-dotenv",
  "pyyaml",
  "httpx",
  "lxml",
  "cssselect",
  "trafilatura",
  "extruct",
  "feedparser",
  "protego",
  "pandas",
  "numpy",
  "pyarrow",
  "duckdb",
  "pandera[pandas]",
  "openpyxl",
  "xlsxwriter",
  "pyreadstat",
  "plotly",
  "networkx",
]

[project.urls]
Homepage = "https://webscrapapp.streamlit.app/"
Repository = "https://github.com/merwanroudane/webscrap"
Documentation = "https://github.com/merwanroudane/webscrap/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/merwanroudane/webscrap/issues"

[project.optional-dependencies]
# Local browser rendering and network API discovery.
browser = ["playwright", "selenium"]
# Bounded multi-page crawling frameworks.
crawler = ["scrapy", "crawlee"]
# Local adaptive/semantic engines.
modern = ["crawl4ai", "scrapling"]
# Provider-independent AI layer. Pick one backend, or litellm for many.
ai = ["anthropic", "openai", "google-genai", "litellm", "instructor"]
# Hosted extraction services (each also needs its own API key).
cloud = ["firecrawl-py", "scrapegraph-py>=2.1.0", "agentql"]
# Agentic browser workflows — last resort, never for ordinary scraping.
agents = ["stagehand", "browser-use", "skyvern"]
# Document parsing. Both are AGPL-3.0: see THIRD_PARTY_LICENSES.md.
documents = ["pymupdf", "docling"]
# Quality-of-life helpers used only where they measurably improve results.
helpers = ["rapidfuzz", "dateparser", "ftfy", "tldextract", "ultimate-sitemap-parser"]
# Research exports. pyreadr is AGPL-3.0 and therefore opt-in.
research = ["kaleido", "pytablewriter", "pyreadr"]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "responses",
  "ruff",
  "mypy",
  "bandit",
  "pip-audit",
]
# Everything that is free, local and permissively licensed.
all-local = [
  "playwright",
  "scrapy",
  "crawlee",
  "crawl4ai",
  "scrapling",
  "rapidfuzz",
  "dateparser",
  "ftfy",
  "tldextract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# runs/ holds generated reproducer scripts and datasets, not project source.
extend-exclude = ["runs", ".pytest_runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# C408: dict(...) kwargs read better in Plotly layout calls.
# UP042: StrEnum would drop the str-subclass behaviour Pydantic serialisation relies on.
ignore = ["B008", "E501", "C408", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff.lint.per-file-ignores]
# app.py and the demo helper must extend sys.path before importing the package.
"app.py" = ["E402"]
"src/scraper_app/ui/demo.py" = ["E402"]
"tests/**" = ["E402"]
