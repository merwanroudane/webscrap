name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio pytest-cov respx responses

      # The suite runs against a bundled fixture server on 127.0.0.1, so it
      # never depends on a live website and never needs an API key.
      - name: Run tests
        env:
          SRWS_ALLOW_PRIVATE_NETWORKS: "true"
          SRWS_REQUESTS_PER_SECOND: "50"
        run: uv run pytest -q --cov=src/scraper_app --cov-report=term-missing

  core-only:
    name: startup without optional engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install core dependencies only
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt
      - name: A missing optional package must not break the app
        run: uv run python scripts/check_core_only.py

  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
